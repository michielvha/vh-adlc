# What vh-adlc's own tests leave in /tmp when a run is killed. `vh-adlc clean`
# reads this file from the default branch only. Each glob names a prefix the
# tests pass to mkdtemp, and none matches the temp base, vh-adlc-<uid>.
schema_version: 1
project: vh-adlc
tmp:
  - {glob: "vh-triage-*", max_age: 6h}
  - {glob: "vh-maintenance-*", max_age: 6h}
  - {glob: "vh-lifecycle-*", max_age: 6h}
  - {glob: "vh-feature-*", max_age: 6h}
  - {glob: "vh-domain-lifecycle-*", max_age: 6h}
  - {glob: "vh-delivery-lifecycle-*", max_age: 6h}
  - {glob: "vh-issue-*", max_age: 6h}
  - {glob: "vh-native-review-*", max_age: 6h}
  - {glob: "vh-settings-file-*", max_age: 6h}
  - {glob: "vh-worktree-handoff-*", max_age: 6h}
  - {glob: "vh-adlc-golden-*", max_age: 6h}
  - {glob: "vh-adlc-fixtures-*", max_age: 6h}
  - {glob: "vh-adlc-claude-*", max_age: 6h}
  - {glob: "vh-adlc-real-*", max_age: 6h}
  - {glob: "vh-adlc-ensure-*", max_age: 6h}
  - {glob: "vh-adlc-at-*", max_age: 6h}
  - {glob: "vh-adlc-s1*", max_age: 6h}
  - {glob: "vh-adlc-S*", max_age: 6h}
