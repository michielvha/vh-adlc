name: Staged documentation collection entry

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collection:
    uses: ./.github/workflows/docs-drift-worker.yml
    with:
      # Select the full commit of the operator-verified release and match the pin.
      component_source: '0000000000000000000000000000000000000000'
      component_pin: .vh-adlc/docs-drift-components/collection.yaml
