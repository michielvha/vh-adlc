name: Version

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Calculate only; publication also requires eligible successful CI
        type: boolean
        default: true
      checked-run-id:
        description: Successful CI run; supplied automatically for eligible publication
        type: string
        default: ''

permissions: {}

jobs:
  version:
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: vhco-pro/.github/.github/workflows/reusable-version.yml@d3c015f061def96e3524abf27c51a1c017011673 # PR preview implementation
    with:
      dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
      checked-run-id: ${{ inputs.checked-run-id || '' }}
      required-jobs: verify / verify,checker,checker-macos
      release-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
