name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: michielvha/go-ci-action@bc485542c70d6cf51da9642c632ef268571597db # main

  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Check the vh-adlc package
        run: bun test tests/vh-adlc

  checker-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Check the vh-adlc package
        run: bun test tests/vh-adlc

  release-gate:
    needs: [verify, checker, checker-macos]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Main, or an open PR labelled release:preview at this commit
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tag=true
          if [[ "$BRANCH" != main ]]; then
            tag=$(gh pr list --head "$BRANCH" --state open --label release:preview \
              --json headRefOid --jq "any(.[]; .headRefOid == \"$SHA\")")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  version:
    needs: release-gate
    permissions:
      contents: read
    uses: vhco-pro/.github/.github/workflows/reusable-version.yml@247f021d7ddf9efde0e8e4c55fc829ce67168d30 # thin GitVersion wrapper under review
    with:
      dry-run: ${{ needs.release-gate.outputs.tag != 'true' }}
      release-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
