name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: ['**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'release:preview' }}
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - name: Avoid duplicate feature-push checks when the PR owns them
        id: route
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.setOutput('run', 'true');
            if (context.eventName !== 'push' ||
                context.ref === `refs/heads/${context.payload.repository.default_branch}`) return;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const {data: prs} = await github.rest.pulls.list({...context.repo,
              state: 'open', head: `${context.repo.owner}:${branch}`});
            if (prs.some(pr => pr.head.sha === context.sha &&
                pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`)) {
              core.notice('The PR event owns checks for this source; skipping duplicate push checks.');
              core.setOutput('run', 'false');
            }

  verify:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    uses: vhco-pro/.github/.github/workflows/reusable-go-ci.yml@d3c015f061def96e3524abf27c51a1c017011673 # PR preview implementation
    with:
      test-release-packaging: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

  checker:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Check the vh-adlc package
        run: bun test tests/vh-adlc

  checker-macos:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Check the vh-adlc package
        run: bun test tests/vh-adlc
