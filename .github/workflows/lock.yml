name: Lock binary

# After each release, moves the plugin's binary lock to it when the binary changed, through a PR that
# merges itself once CI passes. scripts/release/lock-binary.sh decides and does the work.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency:
  group: lock-binary
  cancel-in-progress: false

jobs:
  lock:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    steps:
      # The App token, unlike GITHUB_TOKEN, starts CI on the pushed branch and may merge the PR.
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - id: lock
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: scripts/release/lock-binary.sh "$TAG"
      - name: Open the lock pull request
        id: pull
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.lock.outputs.version }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          branch="chore/lock-$VERSION"
          git switch -c "$branch"
          git -c user.name="$BOT" -c user.email="$BOT@users.noreply.github.com" commit -qam "chore(vh-adlc): lock the $VERSION binary"
          git push -q origin "$branch"
          pr=$(gh pr create --base main --head "$branch" --title "chore(vh-adlc): lock the $VERSION binary" \
            --body "Automated by .github/workflows/lock.yml: v$VERSION changed the binary. checksums.txt is signed by the release key and every archive matches it. Merges itself when CI passes.")
          head=$(git rev-parse HEAD)
          printf 'url=%s\nhead=%s\n' "$pr" "$head" >> "$GITHUB_OUTPUT"
      # The installation token expires after one hour. Use the job token for polling.
      - name: Wait for pull request checks
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull.outputs.url }}
        run: |
          for _ in $(seq 30); do
            count=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup | length')
            if [ "$count" -gt 0 ]; then
              gh pr checks "$PR" --watch --fail-fast
              exit
            fi
            sleep 20
          done
          echo 'The lock pull request checks did not start within ten minutes.' >&2
          exit 1
      - id: merge-token
        if: steps.lock.outputs.changed == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Merge the checked lock pull request
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PR: ${{ steps.pull.outputs.url }}
          PR_HEAD: ${{ steps.pull.outputs.head }}
          VERSION: ${{ steps.lock.outputs.version }}
        run: |
          gh pr merge "$PR" --merge --delete-branch --match-head-commit "$PR_HEAD" \
            --subject "chore(vh-adlc): lock the $VERSION binary"
